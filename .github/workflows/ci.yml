name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch/PR cancels the run that is now out of date.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v6

      - name: Set up .NET from global.json
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore TutoringCentre.slnx

      - name: Build
        run: dotnet build TutoringCentre.slnx --no-restore -c Release

      - name: OpenAPI document is up to date
        run: git diff --exit-code -- frontend/openapi

      - name: Tool restore
        run: dotnet tool restore

      - name: Check for model changes without a migration
        # Design-time model comparison needs valid-looking connection strings but never connects.
        # The design-time factory (Api/Cli) reads the migrations one; the runtime one is unused here but still
        # required by startup validation.
        env:
          ConnectionStrings__Postgres: Host=localhost;Database=ci;Username=ci;Password=ci
          ConnectionStrings__PostgresMigrations: Host=localhost;Database=ci;Username=ci;Password=ci
        run: >
          dotnet ef migrations has-pending-model-changes
          --project src/TutoringCentre.Infrastructure
          --startup-project src/TutoringCentre.Api
          --no-build --configuration Release

      - name: Test (all test projects, including architecture tests)
        run: dotnet test TutoringCentre.slnx --no-build -c Release

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out
        uses: actions/checkout@v6

      - name: Set up Node.js (LTS) with npm cache
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install exactly the lock file
        run: npm ci

      - name: Generated API client is up to date
        working-directory: frontend
        run: |
          npm run generate:api
          git diff --exit-code -- src/api/generated

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Translation keys match (en/ar)
        run: npm run i18n:check

      - name: Test
        run: npm run test:ci

      - name: Build
        run: npm run build

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: tutoring
          POSTGRES_USER: tutoring_dev
          # CI-only throwaway, not a real credential: the service container never leaves this job.
          POSTGRES_PASSWORD: ci-only-throwaway-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tutoring_dev -d tutoring"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # tutoring_app (runtime) and tutoring_owner (migrations) — created by db/bootstrap-roles.sh below, not by
      # the postgres service itself: a GitHub Actions service container has no docker-entrypoint-initdb.d folder.
      ConnectionStrings__Postgres: Host=localhost;Port=5432;Database=tutoring;Username=tutoring_app;Password=ci-only-throwaway-app-password
      ConnectionStrings__PostgresMigrations: Host=localhost;Port=5432;Database=tutoring;Username=tutoring_owner;Password=ci-only-throwaway-owner-password
      # CI-only throwaway seed password, not a real credential: both names are read by different
      # layers (.NET config via Seed__Password, the Playwright spec directly via SEED_PASSWORD).
      Seed__Password: ci-only-throwaway-seed-password
      SEED_PASSWORD: ci-only-throwaway-seed-password
    steps:
      - name: Check out
        uses: actions/checkout@v6

      - name: Set up .NET from global.json
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Set up Node.js (LTS) with npm cache
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Tool restore
        run: dotnet tool restore

      # The service container's own bootstrap has already run by the time steps start (health-checked above),
      # but it only ever creates tutoring_dev — db/bootstrap-roles.sh is what creates the least-privilege roles
      # the two connection strings above actually point at.
      - name: Bootstrap least-privilege database roles
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: tutoring_dev
          PGPASSWORD: ci-only-throwaway-password
          PGDATABASE: tutoring
          TUTORING_OWNER_PASSWORD: ci-only-throwaway-owner-password
          TUTORING_APP_PASSWORD: ci-only-throwaway-app-password
        run: bash db/bootstrap-roles.sh

      # Kestrel auto-generates a development certificate on first HTTPS use, but generating it up
      # front avoids any first-run race with the webServer Playwright starts below. No --trust: that
      # needs an interactive OS keychain prompt, and it is not needed — the dev-server proxy already
      # talks to the API with secure: false (Day 16), bypassing certificate validation, not trust.
      - name: Generate the HTTPS development certificate
        run: dotnet dev-certs https

      - name: Seed the database (centres and staff)
        run: dotnet run --project src/TutoringCentre.Api -- seed

      - name: Install exactly the lock file
        working-directory: frontend
        run: npm ci

      - name: Install Chromium with its system dependencies
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run the E2E auth journeys
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  container:
    name: container
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: tutoring
          POSTGRES_USER: tutoring_dev
          # CI-only throwaway, not a real credential: the service container never leaves this job.
          POSTGRES_PASSWORD: ci-only-throwaway-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tutoring_dev -d tutoring"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out
        uses: actions/checkout@v6

      # Same roles the local Compose stack and the e2e job above rely on: a service container has no
      # docker-entrypoint-initdb.d folder, so db/bootstrap-roles.sh is what actually creates them.
      - name: Bootstrap least-privilege database roles
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: tutoring_dev
          PGPASSWORD: ci-only-throwaway-password
          PGDATABASE: tutoring
          TUTORING_OWNER_PASSWORD: ci-only-throwaway-owner-password
          TUTORING_APP_PASSWORD: ci-only-throwaway-app-password
        run: bash db/bootstrap-roles.sh

      - name: Build the production image
        run: docker build -t tutoring-centre:ci --build-arg COMMIT_SHA=${{ github.sha }} .

      # --network host: the only way a `docker run` container reaches a job service container bound to
      # localhost on a GitHub-hosted runner.
      - name: Apply migrations with the image itself
        run: >
          docker run --rm --network host
          -e ASPNETCORE_ENVIRONMENT=Production
          -e Proxy__KnownNetworks__0=127.0.0.1/32
          -e ConnectionStrings__PostgresMigrations="Host=localhost;Port=5432;Database=tutoring;Username=tutoring_owner;Password=ci-only-throwaway-owner-password"
          -e ConnectionStrings__Postgres="Host=localhost;Port=5432;Database=tutoring;Username=tutoring_app;Password=ci-only-throwaway-app-password"
          tutoring-centre:ci migrate

      - name: Start the container
        run: >
          docker run -d --name tutoring-centre-ci --network host
          -e ASPNETCORE_ENVIRONMENT=Production
          -e Proxy__KnownNetworks__0=127.0.0.1/32
          -e ConnectionStrings__Postgres="Host=localhost;Port=5432;Database=tutoring;Username=tutoring_app;Password=ci-only-throwaway-app-password"
          -e ASPNETCORE_HTTP_PORTS=8080
          tutoring-centre:ci

      - name: Wait for /health/ready
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/health/ready || true)
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 1
          done
          echo "::error::/health/ready never returned 200"
          docker logs tutoring-centre-ci
          exit 1

      - name: / returns HTML with the CSP header
        run: |
          headers=$(curl -s -D - -o /tmp/body.html http://localhost:8080/)
          echo "$headers" | grep -i "^content-security-policy:" || { echo "::error::missing Content-Security-Policy header"; exit 1; }
          head -c 15 /tmp/body.html | grep -qi "<!doctype html" || { echo "::error::response body is not HTML"; exit 1; }

      - name: Container logs (always, for visibility)
        if: always()
        run: docker logs tutoring-centre-ci

      - name: Stop the container
        if: always()
        run: docker rm -f tutoring-centre-ci
